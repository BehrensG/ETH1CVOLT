<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltage Source Control Panel</title>
    <!-- Linked External Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>DC Power Supply Monitor & Control Panel</h1>
    </header>

    <div class="container">
        <!-- Live Telemetry Monitor Block -->
        <div class="dashboard-grid">
            <div class="card">
                <h2>Measured Voltage</h2>
                <div class="readout" id="readout-v">00.000<span class="readout-unit">V</span></div>
            </div>
            <div class="card">
                <h2>Measured Current</h2>
                <div class="readout" id="readout-i">0.0000<span class="readout-unit">A</span></div>
            </div>
        </div>

        <!-- Target Assignment Block -->
        <div class="dashboard-grid">
            <div class="card">
                <h2>Source Settings</h2>
                <form id="controlForm" onsubmit="updateSourceLimits(event)">
                    <div class="control-group">
                        <label for="set_voltage">Output Voltage:</label>
                        <input type="number" id="set_voltage" name="voltage" min="0.000" max="32.000" step="0.001" value="5.000" required>
                        <span class="unit-label">V</span>
                    </div>

                    <div class="control-group">
                        <label for="set_current">Current Limit:</label>
                        <input type="number" id="set_current" name="current" min="0.0000" max="5.0000" step="0.0001" value="1.0000" required>
                        <span class="unit-label">A</span>
                    </div>

                    <div style="text-align: right; margin-top: 1.5rem;">
                        <button type="submit" class="btn btn-submit">Set Values</button>
                    </div>
                </form>
            </div>

            <!-- Output State Power Control Toggle -->
            <div class="card">
                <h2>Power Isolation State</h2>
                <div class="output-panel">
                    <button id="outputBtn" class="btn-output output-off" onclick="toggleOutput()">Output OFF</button>
                    <p class="footer-note">
                        Emergency Cutoff: Disengage terminal outputs immediately by clicking above.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let outputActive = false;

        // 1. Send Source Boundaries to Target Server API
        function updateSourceLimits(event) {
            event.preventDefault();
            const voltage = document.getElementById('set_voltage').value;
            const current = document.getElementById('set_current').value;

            const payload = { 
                voltage: parseFloat(voltage), 
                current: parseFloat(current) 
            };

            fetch('/api/source-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (!res.ok) alert("Error: Limits rejected by hardware firmware.");
            })
            .catch(err => console.error("Communication failure setting limits:", err));
        }

        // 2. Transmit Output Toggle Requirements
        function toggleOutput() {
            outputActive = !outputActive;
            const btn = document.getElementById('outputBtn');

            const payload = { output_enable: outputActive };

            fetch('/api/source-output', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (res.ok) {
                    if (outputActive) {
                        btn.innerText = "Output ON";
                        btn.className = "btn-output output-on";
                    } else {
                        btn.innerText = "Output OFF";
                        btn.className = "btn-output output-off";
                    }
                } else {
                    outputActive = !outputActive; // Revert locally on error handler trip
                    alert("Safety Fault: Power stage isolation loop refused configuration.");
                }
            })
            .catch(err => {
                outputActive = !outputActive;
                alert("Communication error changing active relay profile.");
            });
        }

        // 3. Telemetry Feedback Loop: Continually parse data registers from the web stack
        function pollTelemetry() {
            fetch('/api/source-telemetry')
            .then(res => res.json())
            .then(data => {
                document.getElementById('readout-v').innerHTML = data.v_meas.toFixed(3) + '<span class="readout-unit">V</span>';
                document.getElementById('readout-i').innerHTML = data.i_meas.toFixed(4) + '<span class="readout-unit">A</span>';
            })
            .catch(err => console.warn("Polling dropped connection to instrumentation metrics:", err));
        }

        // Initiate immediately and establish continuous 1000ms loop routines
        setInterval(pollTelemetry, 1000);
        pollTelemetry();
    </script>
</body>
</html>
